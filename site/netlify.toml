# Configuração do SITE NOVO (pasta site/).
# No Netlify, este projeto aponta para o repositório com
# "Base directory" = site — assim o projeto do IFL-BH na raiz continua intacto.
# Não declare "base" aqui: o Netlify já resolve tudo a partir do base directory,
# e repetir a pasta faria o build procurar por site/site.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Link curto para a landing do diagnóstico: cabe em bio de rede social,
# em cartão e em mensagem de WhatsApp sem quebrar a linha.
[[redirects]]
  from = "/d"
  to = "/diagnostico"
  status = 301
  force = true

[[redirects]]
  from = "/diagnostico-patrimonial"
  to = "/diagnostico"
  status = 301
  force = true

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
